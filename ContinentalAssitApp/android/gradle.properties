pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

// Define react-native como alias para react-android
// Esto es clave para solucionar el problema
def resolveDependencyFunction = { project ->
    def depProjectPath = ":${project}"
    includeProject(project, "../node_modules/${project}/android")
    // Configura el alias de react-native para los módulos que aún lo usan
    project(depProjectPath).configurations.create("default")
    project(depProjectPath).getConfigurations().getByName("default")
            .getDependencies().add(
            project.getDependencies().project(
                    path: depProjectPath,
                    configuration: "default"
            )
    )
}

def includeProject(name, path) {
    settings.include(":$name")
    project(":$name").projectDir = new File(rootProject.projectDir, path)
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven {
            url "$rootDir/../node_modules/react-native/android"
            content {
                includeGroup "com.facebook.react"
            }
        }
    }
}

// Agrega esto al final del archivo
gradle.beforeProject { project ->
    project.ext.react = [
        enableHermes: true,
    ]

    project.configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                // Sustituir react-native por react-android
                substitute module('com.facebook.react:react-native') using module("com.facebook.react:react-android:${rootProject.ext.reactNativeVersion}")
            }
        }
    }
}