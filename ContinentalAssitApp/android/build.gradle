// Top-level build file where you can add configuration options common to all sub-projects/modules.

        buildscript {
            ext {
                buildToolsVersion = "34.0.0"
                minSdkVersion = 23
                compileSdkVersion = 34
                targetSdkVersion = 34
                ndkVersion = "26.1.10909125"
                kotlinVersion = "1.9.22"
                gradlePluginVersion = "8.3.0"
                reactNativeVersion = "0.74.7"
                javaSourceCompatibility = JavaVersion.VERSION_17
                javaTargetCompatibility = JavaVersion.VERSION_17
            }


            repositories {
                google()
                mavenCentral()
            }

            dependencies {
                classpath "com.android.tools.build:gradle:${gradlePluginVersion}"
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}"
            }
        }

       // Bloque allprojects actualizado
       allprojects {
           repositories {
               google()
               mavenCentral()
               maven { url 'https://www.jitpack.io' }
               maven {
                   url "$rootDir/../node_modules/react-native/android"
                   content {
                        includeGroup "com.facebook.react"}
                   }
           }
           configurations.all {
               resolutionStrategy {
                   dependencySubstitution {
                       substitute module('com.facebook.react:react-native') using module("com.facebook.react:react-android:${reactNativeVersion}")
                   }
               }
           }

           afterEvaluate { project ->
                if (project.hasProperty('android') &&
                       (project.plugins.hasPlugin('com.android.library') ||
                        project.plugins.hasPlugin('com.android.application'))) {
                   project.android {
                       buildFeatures {
                           buildConfig true
                       }

                       compileOptions {
                           sourceCompatibility JavaVersion.VERSION_17
                           targetCompatibility JavaVersion.VERSION_17
                       }

                       if (project.name == 'react-native-date-picker') {
                           namespace "com.henninghall.date_picker"
                       } else if (project.name == 'react-native-geolocation-service') {
                           namespace "com.agontuk.RNFusedLocation"
                       } else if (project.name == 'react-native-screens') {
                           namespace "com.swmansion.rnscreens"

                           try {
                               if (project.android.externalNativeBuild?.cmake) {
                                   project.android.externalNativeBuild.cmake.enabled = false
                               }
                           } catch (Exception ignored) {
                           }
                       } else if (project.name == 'react-native-splash-screen') {
                           namespace "org.devio.rn.splashscreen"
                       }
                   }
               }
               project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                   kotlinOptions {
                       jvmTarget = '17'
                   }
               }
           }
       }